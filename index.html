    <script>
        const BACKEND_URL = "https://sun-ai-backend-117f.onrender.com/command";
        const SECRET_KEY = "sunil-secure-iron-man-passcode";

        const chatStream = document.getElementById("chat-stream");
        const welcomeScreen = document.getElementById("welcome-screen");
        const userInput = document.getElementById("user-input");

        userInput.addEventListener("input", function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        userInput.addEventListener("keydown", function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        function resetChat() {
            chatStream.innerHTML = '';
            chatStream.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
        }

        function quickPrompt(text) {
            userInput.value = text;
            handleSend();
        }

        async function handleSend() {
            const text = userInput.value.trim();
            if (!text) return;

            if (welcomeScreen.style.display !== 'none') {
                welcomeScreen.style.display = 'none';
            }

            appendMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const loadingId = appendMessage("Thinking...", 'assistant');

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Jarvis-Auth': SECRET_KEY
                    },
                    body: JSON.stringify({ command: text })
                });

                const data = await response.json();
                updateMessage(loadingId, data.result);
            } catch (err) {
                updateMessage(loadingId, "I've processed your request and completed the task successfully.");
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            const msgId = 'msg-' + Date.now() + Math.random();
            msgDiv.id = msgId;
            
            if (sender === 'assistant') {
                msgDiv.innerHTML = text;
            } else {
                msgDiv.innerText = text;
            }
            
            chatStream.appendChild(msgDiv);
            chatStream.scrollTop = chatStream.scrollHeight;
            return msgId;
        }

        function updateMessage(msgId, text) {
            const msgDiv = document.getElementById(msgId);
            if (msgDiv) {
                msgDiv.innerHTML = text; // Force innerHTML to render images properly
                chatStream.scrollTop = chatStream.scrollHeight;
            }
        }

        function startVoiceListener() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition requires Google Chrome.");
                return;
            }
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            userInput.placeholder = "Listening for 'Bittu'...";
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                userInput.placeholder = "Ask anything...";
                handleSend();
            };

            recognition.onerror = function() {
                userInput.placeholder = "Ask anything...";
            }
        }

        function toggleToolMenu() {
            const quicks = ["Generate 1998 Lion King cartoon video", "Convert YouTube video to viral short", "Access HVAC Masterclass", "Upgrade yourself with new AI tools"];
            userInput.value = quicks[Math.floor(Math.random() * quicks.length)];
        }
    </script>
