<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shri - Autonomous Jarvis Agent</title>
    
    <!-- PWA Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0c">
    <link rel="manifest" href="data:application/manifest+json,{
        'name': 'Shri Jarvis Agent',
        'short_name': 'Shri',
        'start_url': './',
        'display': 'standalone',
        'background_color': '#0a0a0c',
        'theme_color': '#00ffcc',
        'icons': [{'src': 'https://img.icons8.com/fluency/96/iron-man.png', 'sizes': '96x96', 'type': 'image/png'}]
    }">

    <style>
        body {
            background-color: #0a0a0c;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 1.5rem;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        p.subtitle {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }
        #btn-listen {
            background: linear-gradient(135deg, #00ffcc, #007755);
            color: #0a0a0c;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 20px;
            width: 100%;
            max-width: 300px;
        }
        #btn-listen:active {
            transform: scale(0.95);
        }
        #status {
            font-size: 0.95rem;
            color: #ffaa00;
            margin-bottom: 20px;
            min-height: 24px;
        }
        #response-box {
            width: 100%;
            max-width: 400px;
            height: 180px;
            background: #12121a;
            border: 1px solid #00ffcc55;
            border-radius: 12px;
            padding: 15px;
            color: #ffffff;
            font-size: 0.9rem;
            text-align: left;
            overflow-y: auto;
            box-sizing: border-box;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <h2>⚡ Shri (Jarvis) App ⚡</h2>
    <p class="subtitle">Unrestricted Autonomous Voice Agent</p>

    <button id="btn-listen" onclick="startListening()">🎙️ Start Voice Listener</button>
    <div id="status">Status: Standby... Tap to speak</div>
    <div id="response-box">Awaiting your command, Sir...</div>

    <script>
        const BACKEND_URL = "https://sun-ai-backend-117f.onrender.com/command";
        const SECRET_KEY = "sunil-secure-iron-man-passcode";

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Speech recognition is not supported on this browser. Please use Google Chrome.");
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            document.getElementById("status").innerText = "Status: Listening...";

            recognition.start();

            recognition.onresult = function(event) {
                const speechText = event.results[0][0].transcript;
                document.getElementById("status").innerText = `Heard: "${speechText}"`;
                document.getElementById("response-box").innerText = "Processing command via free internet routing...";
                
                sendToBackend(speechText);
            };

            recognition.onerror = function(event) {
                document.getElementById("status").innerText = "Error occurred: " + event.error;
            };

            recognition.onspeechend = function() {
                recognition.stop();
            };
        }

        async function sendToBackend(command) {
            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Jarvis-Auth': SECRET_KEY
                    },
                    body: JSON.stringify({ command: command })
                });

                const data = await response.json();
                if (data.success) {
                    document.getElementById("response-box").innerText = data.result;
                    document.getElementById("status").innerText = "Status: Task Completed Successfully!";
                } else {
                    document.getElementById("response-box").innerText = "Error: " + data.result;
                    document.getElementById("status").innerText = "Status: Ready";
                }
            } catch (err) {
                document.getElementById("response-box").innerText = "Network connection error to Render backend.";
                document.getElementById("status").innerText = "Status: Error";
            }
        }
    </script>
</body>
</html>
