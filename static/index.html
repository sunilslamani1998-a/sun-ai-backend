<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101827">

    <title>SUN.AI Advanced</title>

    <style>
        :root {
            color-scheme: dark;
            --background: #101827;
            --panel: #172235;
            --panel-light: #202e44;
            --border: #34445e;
            --text: #edf3ff;
            --muted: #aab8cf;
            --accent: #65a9ff;
            --success: #5bd49a;
            --danger: #ff7777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        h2 {
            margin-top: 0;
            font-size: 19px;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .panel {
            padding: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            min-width: 0;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            color: var(--muted);
            margin: 12px 0 6px;
            font-size: 14px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0c1422;
            color: var(--text);
            font: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 11px 15px;
            margin-top: 12px;
            background: var(--accent);
            color: #061324;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary {
            background: var(--panel-light);
            color: var(--text);
            border: 1px solid var(--border);
        }

        button.danger {
            background: var(--danger);
            color: #250606;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .status {
            color: var(--muted);
            font-size: 14px;
            overflow-wrap: anywhere;
        }

        .status.success {
            color: var(--success);
        }

        .status.error {
            color: var(--danger);
        }

        .chat-history {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 420px;
            overflow-y: auto;
            margin: 16px 0;
        }

        .message {
            padding: 13px;
            border-radius: 10px;
            background: var(--panel-light);
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .message.user {
            border-left: 3px solid var(--accent);
        }

        .message.assistant {
            border-left: 3px solid var(--success);
        }

        .message strong {
            display: block;
            margin-bottom: 5px;
        }

        .item {
            padding: 12px;
            margin-top: 10px;
            background: var(--panel-light);
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        .item small {
            display: block;
            color: var(--muted);
            margin-top: 5px;
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .row > * {
            flex: 1;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 700px) {
            body {
                padding: 12px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .panel {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <header>
        <div>
            <h1>☀ SUN.AI Advanced</h1>
            <div class="subtitle">Your personal AI assistant — Bittu</div>
        </div>

        <div>
            <div id="healthStatus" class="status">Checking backend...</div>
            <button class="secondary" id="healthButton">
                Check backend
            </button>
        </div>
    </header>

    <section class="panel">
        <h2>Connection</h2>

        <label for="apiBase">Backend URL</label>
        <input
            id="apiBase"
            type="url"
            placeholder="https://your-service.onrender.com"
            autocomplete="url"
        >

        <label for="apiToken">API token</label>
        <input
            id="apiToken"
            type="password"
            placeholder="Enter your SUN.AI API token"
            autocomplete="off"
        >

        <div class="row">
            <button id="connectButton">Connect</button>
            <button class="secondary" id="disconnectButton">
                Disconnect
            </button>
        </div>

        <p class="status">
            The token is kept in this page's memory only. Do not share it.
        </p>
    </section>

    <div class="grid" style="margin-top: 18px;">
        <section class="panel full-width">
            <h2>Chat with Bittu</h2>

            <div id="chatHistory" class="chat-history">
                <div class="message assistant">
                    <strong>Bittu</strong>
                    Hello! Connect to your backend to start chatting.
                </div>
            </div>

            <label for="chatPrompt">Message</label>
            <textarea
                id="chatPrompt"
                placeholder="Ask Bittu something..."
            ></textarea>

            <button id="sendButton">Send message</button>
            <div id="chatStatus" class="status"></div>
        </section>

        <section class="panel">
            <h2>Memory</h2>

            <label for="memoryContent">Memory content</label>
            <textarea
                id="memoryContent"
                placeholder="What should Bittu remember?"
            ></textarea>

            <label for="memoryCategory">Category</label>
            <input
                id="memoryCategory"
                type="text"
                value="general"
                maxlength="64"
            >

            <label for="memoryImportance">Importance</label>
            <select id="memoryImportance">
                <option value="1">1 — Normal</option>
                <option value="2">2</option>
                <option value="3">3 — Medium</option>
                <option value="4">4</option>
                <option value="5">5 — High</option>
            </select>

            <button id="saveMemoryButton">Save memory</button>
            <button class="secondary" id="loadMemoryButton">
                Load memories
            </button>
            <button class="danger" id="clearMemoryButton">
                Clear all memories
            </button>

            <div id="memoryStatus" class="status"></div>
            <div id="memoryList"></div>
        </section>

        <section class="panel">
            <h2>Feedback</h2>

            <label for="feedbackMessage">Feedback</label>
            <textarea
                id="feedbackMessage"
                placeholder="How did Bittu do?"
            ></textarea>

            <label for="feedbackRating">Rating</label>
            <select id="feedbackRating">
                <option value="5">5 — Excellent</option>
                <option value="4">4 — Good</option>
                <option value="3">3 — Average</option>
                <option value="2">2 — Poor</option>
                <option value="1">1 — Very poor</option>
            </select>

            <label for="feedbackDetails">Additional details</label>
            <textarea
                id="feedbackDetails"
                placeholder="Optional"
            ></textarea>

            <button id="submitFeedbackButton">
                Submit feedback
            </button>

            <button class="secondary" id="loadLearningButton">
                Load learning summary
            </button>

            <div id="feedbackStatus" class="status"></div>
            <div id="learningSummary" class="item hidden"></div>
        </section>

        <section class="panel full-width">
            <h2>Code improvement proposals</h2>

            <button id="loadProposalsButton">
                Load proposals
            </button>

            <div id="proposalStatus" class="status"></div>
            <div id="proposalList"></div>
        </section>
    </div>
</div>

<script>
"use strict";

const elements = {
    apiBase: document.getElementById("apiBase"),
    apiToken: document.getElementById("apiToken"),

    healthStatus: document.getElementById("healthStatus"),
    healthButton: document.getElementById("healthButton"),

    connectButton: document.getElementById("connectButton"),
    disconnectButton: document.getElementById("disconnectButton"),

    chatHistory: document.getElementById("chatHistory"),
    chatPrompt: document.getElementById("chatPrompt"),
    sendButton: document.getElementById("sendButton"),
    chatStatus: document.getElementById("chatStatus"),

    memoryContent: document.getElementById("memoryContent"),
    memoryCategory: document.getElementById("memoryCategory"),
    memoryImportance: document.getElementById("memoryImportance"),
    saveMemoryButton: document.getElementById("saveMemoryButton"),
    loadMemoryButton: document.getElementById("loadMemoryButton"),
    clearMemoryButton: document.getElementById("clearMemoryButton"),
    memoryStatus: document.getElementById("memoryStatus"),
    memoryList: document.getElementById("memoryList"),

    feedbackMessage: document.getElementById("feedbackMessage"),
    feedbackRating: document.getElementById("feedbackRating"),
    feedbackDetails: document.getElementById("feedbackDetails"),
    submitFeedbackButton: document.getElementById("submitFeedbackButton"),
    loadLearningButton: document.getElementById("loadLearningButton"),
    feedbackStatus: document.getElementById("feedbackStatus"),
    learningSummary: document.getElementById("learningSummary"),

    loadProposalsButton: document.getElementById("loadProposalsButton"),
    proposalStatus: document.getElementById("proposalStatus"),
    proposalList: document.getElementById("proposalList")
};


function setStatus(element, message, type = "") {
    element.textContent = message;
    element.className = "status";

    if (type) {
        element.classList.add(type);
    }
}


function getApiBase() {
    const value = elements.apiBase.value.trim();

    if (!value) {
        throw new Error("Enter your backend URL.");
    }

    let url;

    try {
        url = new URL(value);
    } catch {
        throw new Error("Backend URL is invalid.");
    }

    if (!["http:", "https:"].includes(url.protocol)) {
        throw new Error("Backend URL must use HTTP or HTTPS.");
    }

    return url.origin;
}


function getApiToken() {
    const token = elements.apiToken.value.trim();

    if (!token) {
        throw new Error("Enter your API token.");
    }

    return token;
}


async function apiRequest(path, options = {}) {
    const base = getApiBase();
    const token = getApiToken();

    const headers = new Headers(options.headers || {});

    headers.set("Authorization", `Bearer ${token}`);

    if (options.body !== undefined) {
        headers.set("Content-Type", "application/json");
    }

    const response = await fetch(`${base}${path}`, {
        ...options,
        headers
    });

    const responseText = await response.text();

    let data = {};

    if (responseText) {
        try {
            data = JSON.parse(responseText);
        } catch {
            throw new Error("Backend returned an invalid response.");
        }
    }

    if (!response.ok) {
        const detail = data.detail;

        if (typeof detail === "string") {
            throw new Error(detail);
        }

        throw new Error(`Request failed with HTTP ${response.status}.`);
    }

    return data;
}


function addChatMessage(role, content) {
    const message = document.createElement("div");

    message.className = `message ${role}`;

    const title = document.createElement("strong");
    title.textContent = role === "user" ? "You" : "Bittu";

    const text = document.createElement("div");
    text.textContent = content;

    message.append(title, text);
    elements.chatHistory.appendChild(message);

    elements.chatHistory.scrollTop =
        elements.chatHistory.scrollHeight;
}


async function checkHealth() {
    setStatus(elements.healthStatus, "Checking backend...");

    try {
        const base = getApiBase();

        const response = await fetch(`${base}/health`);

        if (!response.ok) {
            throw new Error("Health check failed.");
        }

        const data = await response.json();

        const healthy =
            data.status === "ok" &&
            data.database === "connected";

        setStatus(
            elements.healthStatus,
            healthy
                ? "Backend online"
                : "Backend degraded",
            healthy ? "success" : "error"
        );

    } catch (error) {
        setStatus(
            elements.healthStatus,
            error.message || "Backend unavailable",
            "error"
        );
    }
}


async function sendMessage() {
    const prompt = elements.chatPrompt.value.trim();

    if (!prompt) {
        setStatus(elements.chatStatus, "Enter a message.");
        return;
    }

    elements.sendButton.disabled = true;

    addChatMessage("user", prompt);
    elements.chatPrompt.value = "";

    setStatus(elements.chatStatus, "Bittu is thinking...");

    try {
        const data = await apiRequest("/api/chat", {
            method: "POST",
            body: JSON.stringify({ prompt })
        });

        addChatMessage(
            "assistant",
            data.response || "No response was returned."
        );

        setStatus(elements.chatStatus, "Response received.", "success");

    } catch (error) {
        addChatMessage(
            "assistant",
            `Request failed: ${error.message}`
        );

        setStatus(elements.chatStatus, error.message, "error");

    } finally {
        elements.sendButton.disabled = false;
    }
}


async function saveMemory() {
    const content = elements.memoryContent.value.trim();

    if (!content) {
        setStatus(elements.memoryStatus, "Enter memory content.");
        return;
    }

    try {
        const data = await apiRequest("/api/memory", {
            method: "POST",
            body: JSON.stringify({
                content,
                category: elements.memoryCategory.value.trim() || "general",
                importance: Number(elements.memoryImportance.value)
            })
        });

        elements.memoryContent.value = "";

        setStatus(
            elements.memoryStatus,
            `Memory saved. ID: ${data.memory_id}`,
            "success"
        );

        await loadMemories();

    } catch (error) {
        setStatus(elements.memoryStatus, error.message, "error");
    }
}


async function loadMemories() {
    try {
        const data = await apiRequest("/api/memory?limit=100");

        elements.memoryList.replaceChildren();

        for (const item of data.memories || []) {
            const container = document.createElement("div");
            container.className = "item";

            const content = document.createElement("div");
            content.textContent = item.content;

            const metadata = document.createElement("small");

            metadata.textContent =
                `Category: ${item.category} | ` +
                `Importance: ${item.importance} | ` +
                `ID: ${item.id}`;

            const deleteButton = document.createElement("button");
            deleteButton.className = "danger";
            deleteButton.textContent = "Delete memory";

            deleteButton.addEventListener("click", async () => {
                await deleteMemory(item.id);
            });

            container.append(content, metadata, deleteButton);
            elements.memoryList.appendChild(container);
        }

        setStatus(
            elements.memoryStatus,
            `${data.count} memories loaded.`,
            "success"
        );

    } catch (error) {
        setStatus(elements.memoryStatus, error.message, "error");
    }
}


async function deleteMemory(memoryId) {
    try {
        await apiRequest(`/api/memory/${memoryId}`, {
            method: "DELETE"
        });

        await loadMemories();

    } catch (error) {
        setStatus(elements.memoryStatus, error.message, "error");
    }
}


async function clearMemories() {
    const confirmed = window.confirm(
        "Delete all stored memories? This cannot be undone."
    );

    if (!confirmed) {
        return;
    }

    try {
        const data = await apiRequest("/api/memory", {
            method: "DELETE"
        });

        setStatus(
            elements.memoryStatus,
            `${data.deleted_count} memories deleted.`,
            "success"
        );

        await loadMemories();

    } catch (error) {
        setStatus(elements.memoryStatus, error.message, "error");
    }
}


async function submitFeedback() {
    const message = elements.feedbackMessage.value.trim();

    if (!message) {
        setStatus(elements.feedbackStatus, "Enter feedback.");
        return;
    }

    try {
        const data = await apiRequest("/api/feedback", {
            method: "POST",
            body: JSON.stringify({
                message,
                rating: Number(elements.feedbackRating.value),
                details: elements.feedbackDetails.value.trim() || null
            })
        });

        elements.feedbackMessage.value = "";
        elements.feedbackDetails.value = "";

        setStatus(
            elements.feedbackStatus,
            `Feedback saved. ID: ${data.feedback_id}`,
            "success"
        );

    } catch (error) {
        setStatus(elements.feedbackStatus, error.message, "error");
    }
}


async function loadLearning() {
    try {
        const data = await apiRequest("/api/learning");

        elements.learningSummary.classList.remove("hidden");

        elements.learningSummary.textContent =
            JSON.stringify(data, null, 2);

        setStatus(
            elements.feedbackStatus,
            "Learning summary loaded.",
            "success"
        );

    } catch (error) {
        setStatus(elements.feedbackStatus, error.message, "error");
    }
}


async function loadProposals() {
    try {
        const data = await apiRequest("/api/improvements");

        elements.proposalList.replaceChildren();

        for (const proposal of data.proposals || []) {
            const container = document.createElement("div");
            container.className = "item";

            const title = document.createElement("strong");
            title.textContent = proposal.title;

            const description = document.createElement("div");
            description.textContent = proposal.description;

            const metadata = document.createElement("small");

            metadata.textContent =
                `File: ${proposal.target_file} | ` +
                `Status: ${proposal.status} | ` +
                `ID: ${proposal.id}`;

            container.append(title, description, metadata);

            elements.proposalList.appendChild(container);
        }

        setStatus(
            elements.proposalStatus,
            `${data.count} proposals loaded.`,
            "success"
        );

    } catch (error) {
        setStatus(elements.proposalStatus, error.message, "error");
    }
}


function disconnect() {
    elements.apiToken.value = "";

    setStatus(
        elements.healthStatus,
        "Disconnected"
    );

    setStatus(
        elements.chatStatus,
        "API token cleared."
    );
}


elements.healthButton.addEventListener("click", checkHealth);
elements.connectButton.addEventListener("click", checkHealth);
elements.disconnectButton.addEventListener("click", disconnect);

elements.sendButton.addEventListener("click", sendMessage);

elements.chatPrompt.addEventListener("keydown", event => {
    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {
        event.preventDefault();
        sendMessage();
    }
});

elements.saveMemoryButton.addEventListener("click", saveMemory);
elements.loadMemoryButton.addEventListener("click", loadMemories);
elements.clearMemoryButton.addEventListener("click", clearMemories);

elements.submitFeedbackButton.addEventListener(
    "click",
    submitFeedback
);

elements.loadLearningButton.addEventListener(
    "click",
    loadLearning
);

elements.loadProposalsButton.addEventListener(
    "click",
    loadProposals
);
</script>
</body>
</html>
