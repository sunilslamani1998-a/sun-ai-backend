<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUN.AI Advanced Agent</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --border: #334155; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        h1 { margin: 0; font-size: 1.5rem; color: var(--accent); }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        textarea { width: 100%; height: 100px; background: #090d16; border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; resize: vertical; font-size: 1rem; box-sizing: border-box; }
        button { background: var(--accent); color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        pre { background: #090d16; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); font-size: 0.9rem; }
        .patch-box { background: #1b263b; border-left: 4px solid #f59e0b; padding: 10px 15px; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SUN.AI Advanced</h1>
            <span id="status-badge" style="color: #4ade80; font-size: 0.9rem;">● System Online</span>
        </header>

        <div class="card">
            <h3>Agent Task Command Center</h3>
            <textarea id="promptInput" placeholder="Enter your complex task, research query, or coding request..."></textarea>
            <button onclick="runTask()">Execute Task with Planning</button>
        </div>

        <div class="card">
            <h3>Execution Output & Verification Log</h3>
            <pre id="outputLog">Ready for input...</pre>
        </div>

        <div class="card" id="patchCard" style="display:none;">
            <h3>Self-Repair Code Diff (Approval Required)</h3>
            <div id="patchContent"></div>
            <button style="background: #22c55e;" onclick="resolvePatch(true)">Approve & Apply Patch</button>
            <button style="background: #ef4444; margin-left: 10px;" onclick="resolvePatch(false)">Reject</button>
        </div>
    </div>

    <script>
        let currentPatchId = null;

        async function runTask() {
            const prompt = document.getElementById('promptInput').value;
            if (!prompt) return alert('Please enter a prompt.');
            
            document.getElementById('outputLog').innerText = 'Planning and executing task...';
            
            try {
                const res = await fetch('/api/agent/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                document.getElementById('outputLog').innerText = JSON.stringify(data, null, 2);

                if (data.pending_patch_id) {
                    currentPatchId = data.pending_patch_id;
                    document.getElementById('patchCard').style.display = 'block';
                    loadPatches();
                }
            } catch (err) {
                document.getElementById('outputLog').innerText = 'Error: ' + err.message;
            }
        }

        async function loadPatches() {
            const res = await fetch('/api/agent/patches');
            const data = await res.json();
            if (data.patches && data.patches.length > 0) {
                document.getElementById('patchContent').innerHTML = `<pre>${data.patches[0].diff}</pre>`;
                currentPatchId = data.patches[0].id;
                document.getElementById('patchCard').style.display = 'block';
            }
        }

        async function resolvePatch(approved) {
            if (!currentPatchId) return;
            const res = await fetch('/api/agent/approve-patch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ patch_id: currentPatchId, approved })
            });
            const data = await res.json();
            alert(data.message);
            document.getElementById('patchCard').style.display = 'none';
            currentPatchId = null;
        }
    </script>
</body>
</html>
