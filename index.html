<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUN.AI Advanced</title>
<style>
body{margin:0;background:#10141d;color:#eef2ff;font:16px Arial,sans-serif}
main{max-width:850px;margin:auto;padding:24px}
section{background:#1b2230;padding:18px;margin:14px 0;border-radius:12px}
textarea,input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0;
background:#0f1520;color:white;border:1px solid #46536a;border-radius:8px}
button{padding:10px 16px;border:0;border-radius:8px;background:#20b486;
color:#07150f;font-weight:bold;cursor:pointer;margin:4px}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
small{color:#aab6ca}
</style>
</head>
<body>
<main>
<h1>☀ SUN.AI Advanced</h1>
<p><small>Supervised AI assistant · Keep your API token private.</small></p>

<section>
<h3>API connection</h3>
<input id="token" type="password" autocomplete="off"
placeholder="SUNAI_API_TOKEN">
<button onclick="connect()">Check connection</button>
<span id="connection"></span>
</section>

<section>
<h3>Ask SUN.AI</h3>
<textarea id="prompt" rows="4" placeholder="What would you like help with?"></textarea>
<button onclick="chat()">Send</button>
<pre id="answer"></pre>
</section>

<section>
<h3>Save a memory</h3>
<textarea id="memory" rows="2" placeholder="Information to remember"></textarea>
<button onclick="saveMemory()">Save memory</button>
<pre id="memoryResult"></pre>
</section>

<section>
<h3>Give feedback</h3>
<input id="rating" type="number" min="1" max="5" value="5"
aria-label="Rating from 1 to 5">
<textarea id="notes" rows="2" placeholder="What should improve?"></textarea>
<button onclick="feedback()">Submit feedback</button>
<pre id="feedbackResult"></pre>
</section>

<section>
<h3>Improvement proposals</h3>
<button onclick="showProposals()">View proposals</button>
<pre id="proposals"></pre>
<p><small>Proposals are not automatically applied to source files.</small></p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
let lastPrompt = "";
let lastAnswer = "";

async function api(path, method="GET", body=null) {
  const token = $("token").value.trim();
  const options = {
    method,
    headers: {"Authorization": "Bearer " + token}
  };
  if (body !== null) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(data.detail || "Request failed: " + response.status);
  }
  return data;
}

async function connect() {
  try {
    const r = await fetch("/health");
    $("connection").textContent = r.ok ? " Server healthy" : " Server unavailable";
  } catch {
    $("connection").textContent = " Cannot reach server";
  }
}

async function chat() {
  try {
    lastPrompt = $("prompt").value.trim();
    if (!lastPrompt) return;
    $("answer").textContent = "Working...";
    const r = await api("/api/chat", "POST", {prompt:lastPrompt});
    lastAnswer = r.answer;
    $("answer").textContent = r.answer;
  } catch(e) {
    $("answer").textContent = e.message;
  }
}

async function saveMemory() {
  try {
    const r = await api("/api/memory", "POST",
      {content:$("memory").value});
    $("memoryResult").textContent = JSON.stringify(r, null, 2);
  } catch(e) {
    $("memoryResult").textContent = e.message;
  }
}

async function feedback() {
  try {
    if (!lastPrompt || !lastAnswer) {
      throw new Error("Ask SUN.AI a question before giving feedback.");
    }
    const r = await api("/api/feedback", "POST", {
      task:lastPrompt,
      response:lastAnswer,
      rating:Number($("rating").value),
      notes:$("notes").value
    });
    $("feedbackResult").textContent = JSON.stringify(r, null, 2);
  } catch(e) {
    $("feedbackResult").textContent = e.message;
  }
}

async function showProposals() {
  try {
    const r = await api("/api/improvements");
    $("proposals").textContent = JSON.stringify(r, null, 2);
  } catch(e) {
    $("proposals").textContent = e.message;
  }
}
</script>
</body>
</html>
